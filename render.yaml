services:
  - type: web
    name: goal-drift-multiplayer
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: ZIINA_ACCESS_TOKEN
        sync: false
      - key: SKIN_TOKEN_SECRET
        sync: false
      - key: ZIINA_TEST_MODE
        value: "false"
